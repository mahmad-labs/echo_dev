<div class="activity-timeline">{% for item in timeline %}<article class="timeline-item" id="record-{{ item.id }}"><span class="timeline-icon"><svg><use href="{% static 'icons.svg' %}#{{ item.icon }}"></use></svg></span><div><div class="timeline-meta"><strong>{{ item.type }}</strong><span>·</span><small>{{ item.updated_at|timesince }} ago</small></div><h3>{{ item.title }}</h3><p>{{ item.description }}</p></div><span class="timeline-status status-{{ item.status }}">{{ item.status|title }}</span></article>{% empty %}<div class="large-empty"><svg><use href="{% static 'icons.svg' %}#activity"></use></svg><h3>Your activity stream is quiet</h3><p>As Echo works with you, meaningful changes will appear here.</p></div>{% endfor %}</div>
